<!doctype html>
<html lang="auto">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Raqeeb — Venue Security & AI Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        color-scheme: dark;
        --bg: #0a1110;
        --card: #111a18;
        --c2: #17221f;
        --bd: #2a3934;
        --tx: #edf4ef;
        --mu: #98aaa2;
        --cy: #64ddbf;
        --gr: #c1e879;
        --am: #f2bd68;
        --or: #ef8f63;
        --rd: #ff7168;
        --bl: #8caeff;
        --muted-foreground: #111a2eb5;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        background:
          linear-gradient(135deg, #101a16 0%, transparent 42%),
          linear-gradient(315deg, #10191b 0%, transparent 48%),
          var(--bg);
        color: var(--tx);
        font:
          14px/1.5 "IBM Plex Sans",
          system-ui,
          sans-serif;
      }
      .app {
        display: flex;
        min-height: 100%;
      }
      nav {
        width: 232px;
        flex: none;
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        height: 100dvh;
        background: #0a1020ee;
        border-right: 1px solid var(--bd);
        display: flex;
        flex-direction: column;
        padding: 18px 12px;
      }
      .logo {
        font-weight: 700;
        font-size: 25px;
        padding: 4px 10px 16px;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .logo span {
        color: transparent;
        background: linear-gradient(
          110deg,
          var(--tx) 0%,
          var(--tx) 40%,
          #fff 48%,
          #a5f3fc 52%,
          var(--tx) 60%,
          var(--tx) 100%
        );
        background-size: 250% 100%;
        background-position: 0 50%;
        background-clip: text;
        -webkit-background-clip: text;
        animation: logo-shimmer 3.2s ease-in-out infinite alternate;
      }
      @keyframes logo-shimmer {
        to {
          background-position: 100% 50%;
        }
      }
      .logo i {
        width: 26px;
        height: 26px;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--cy), var(--bl));
      }
      .logo-eye {
        width: 30px;
        height: 30px;
        flex: none;
        color: var(--cy);
        filter: drop-shadow(0 0 7px #64ddbf33);
      }
      nav a {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 9px 12px;
        border-radius: 10px;
        color: var(--mu);
        cursor: pointer;
        transition: 0.2s;
      }
      nav a:hover {
        background: #ffffff08;
        color: var(--tx);
      }
      nav a.on {
        background: #22d3ee14;
        color: var(--cy);
        box-shadow: inset 2px 0 var(--cy);
      }
      .sys {
        margin-top: auto;
        padding: 12px;
        border: 1px solid var(--bd);
        border-radius: 12px;
        font-size: 12px;
        color: var(--mu);
        display: grid;
        gap: 5px;
        background: var(--card);
      }
      .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--gr);
        box-shadow: 0 0 8px var(--gr);
        margin-right: 6px;
        animation: pu 2s infinite;
      }
      .mn {
        flex: 1;
        min-width: 0;
        position: relative;
      }
      .top {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 20;
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 12px 24px;
        background: #070b14dd;
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--bd);
      }
      .top input {
        flex: 1;
        max-width: 460px;
        background: var(--card);
        border: 1px solid var(--bd);
        color: var(--tx);
        padding: 9px 14px;
        border-radius: 10px;
        outline: 0;
        font: inherit;
      }
      .top input:focus {
        border-color: var(--cy);
      }
      .chip {
        padding: 6px 11px;
        border-radius: 99px;
        border: 1px solid var(--bd);
        font-size: 12px;
        cursor: pointer;
        background: var(--card);
        color: var(--mu);
        white-space: nowrap;
      }
      .chip.on {
        color: var(--cy);
        border-color: #22d3ee55;
      }
      main {
        padding: 24px;
        display: grid;
        gap: 16px;
      }
      main > * {
        min-width: 0;
      }
      h1 {
        font-size: 20px;
      }
      h2 {
        font-size: 15px;
        margin-bottom: 8px;
      }
      .card {
        background: linear-gradient(180deg, var(--c2), var(--card));
        border: 1px solid var(--bd);
        border-radius: 16px;
        padding: 16px;
        box-shadow: 0 8px 30px #0006;
      }
      .mu {
        color: var(--mu);
      }
      .big {
        font-size: 26px;
        font-weight: 700;
        display: block;
      }
      .g {
        display: grid;
        gap: 14px;
      }
      .st {
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      }
      .two {
        grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr);
      }
      @media (max-width: 1100px) {
        .two {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 820px) {
        nav {
          width: 64px;
        }
        nav a span,
        .logo span,
        .sys {
          display: none;
        }
        main {
          padding: 14px;
        }
        .top {
          padding: 10px 14px;
        }
      }
      .b {
        font:
          700 10px Inter,
          sans-serif;
        letter-spacing: 0.05em;
        padding: 3px 8px;
        border-radius: 99px;
        color: var(--c);
        background: color-mix(in srgb, var(--c) 14%, transparent);
        border: 1px solid color-mix(in srgb, var(--c) 40%, transparent);
        white-space: nowrap;
      }
      .al {
        display: grid;
        grid-template-columns: 4px 1fr auto;
        gap: 12px;
        align-items: center;
        padding: 12px 14px;
        border: 1px solid var(--bd);
        border-radius: 12px;
        background: var(--card);
        cursor: pointer;
        transition: 0.2s;
      }
      .al:hover {
        transform: translateY(-1px);
        border-color: var(--c);
      }
      .al .ab {
        align-self: stretch;
        border-radius: 4px;
        background: var(--c);
      }
      .al.cr {
        box-shadow:
          0 0 0 1px #f43f5e44,
          0 0 24px #f43f5e22;
      }
      .am {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .tw {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th {
        font-size: 11px;
        color: var(--mu);
        text-align: left;
        padding: 8px 10px;
        font-weight: 600;
      }
      td {
        padding: 10px;
        border-top: 1px solid var(--bd);
        white-space: nowrap;
      }
      tr.r {
        cursor: pointer;
      }
      tr.r:hover td {
        background: #ffffff06;
      }
      select {
        background: var(--c2);
        color: var(--tx);
        border: 1px solid var(--bd);
        border-radius: 8px;
        padding: 6px 8px;
        font: inherit;
      }
      .fl {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .ov {
        position: fixed;
        inset: 0;
        background: #02050ccc;
        backdrop-filter: blur(4px);
        display: none;
        z-index: 50;
        padding: 20px;
        overflow: auto;
      }
      .ov.on {
        display: block;
      }
      .md {
        max-width: 920px;
        margin: 0 auto;
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 18px;
        padding: 22px;
        display: grid;
        gap: 16px;
        animation: in 0.25s;
      }
      .md.dr {
        max-width: 440px;
        margin-right: 0;
      }
      @keyframes in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }
      @keyframes pu {
        50% {
          opacity: 0.4;
        }
      }
      .kv {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 10px;
      }
      .kv div {
        background: var(--c2);
        border: 1px solid var(--bd);
        border-radius: 10px;
        padding: 8px 10px;
      }
      .kv small {
        display: block;
        color: var(--mu);
        font-size: 11px;
      }
      .wf {
        display: flex;
        gap: 6px;
        overflow-x: auto;
      }
      .wf div {
        flex: 1;
        min-width: 104px;
        text-align: center;
        font-size: 11px;
        padding: 8px 4px;
        border-radius: 10px;
        border: 1px solid var(--bd);
        color: var(--mu);
      }
      .wf .d {
        color: var(--gr);
        border-color: #34d39955;
      }
      .wf .a {
        color: var(--cy);
        border-color: var(--cy);
        box-shadow: 0 0 14px #22d3ee33;
      }
      .tl {
        border-left: 2px solid var(--bd);
        padding-left: 16px;
        display: grid;
        gap: 12px;
        margin-left: 6px;
      }
      .tl div {
        position: relative;
      }
      .tl div:before {
        content: "";
        position: absolute;
        left: -22px;
        top: 5px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--cy);
      }
      .btn {
        background: linear-gradient(135deg, var(--cy), var(--bl));
        color: #031018;
        border: 0;
        padding: 9px 16px;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn.o {
        background: none;
        color: var(--tx);
        border: 1px solid var(--bd);
      }
      button {
        font: inherit;
      }
      .x {
        float: right;
        cursor: pointer;
        color: var(--mu);
        font-size: 22px;
        background: none;
        border: 0;
      }
      #ts {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 80;
        display: grid;
        gap: 8px;
      }
      #ts div {
        background: var(--c2);
        border: 1px solid var(--cy);
        padding: 10px 16px;
        border-radius: 10px;
        animation: in 0.25s;
      }
      #np {
        position: absolute;
        right: 24px;
        top: 58px;
        width: 340px;
        max-width: calc(100vw - 28px);
        display: none;
        z-index: 30;
        gap: 8px;
      }
      #np.on {
        display: grid;
      }
      .nt {
        padding: 10px;
        border-radius: 10px;
        background: var(--c2);
        border: 1px solid var(--bd);
        border-left: 3px solid var(--c);
        font-size: 13px;
      }
      .nt.cr {
        box-shadow: 0 0 16px #f43f5e33;
      }
      .chat-launch {
        position: fixed;
        right: 22px;
        bottom: 22px;
        z-index: 40;
        border: 1px solid #22d3ee66;
        background: var(--c2);
        color: var(--cy);
        padding: 11px 15px;
        border-radius: 12px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 8px 24px #0008;
      }
      #chat {
        position: fixed;
        right: 22px;
        bottom: 78px;
        z-index: 40;
        width: 380px;
        max-width: calc(100vw - 28px);
        height: min(520px, calc(100dvh - 110px));
        display: none;
        grid-template-rows: auto 1fr auto;
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 14px;
        box-shadow: 0 18px 50px #000a;
        overflow: hidden;
      }
      #chat.on {
        display: grid;
      }
      #chatHead,
      #chatForm {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 10px 12px;
      }
      #chatHead {
        background: var(--c2);
        border-bottom: 1px solid var(--bd);
      }
      #chatForm {
        border-top: 1px solid var(--bd);
      }
      #chatLog {
        padding: 12px;
        overflow: auto;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
      .chat-msg {
        max-width: 92%;
        padding: 9px 11px;
        border: 1px solid var(--bd);
        border-radius: 10px;
        background: var(--c2);
        font-size: 13px;
        white-space: pre-wrap;
      }
      .chat-msg.user {
        align-self: flex-end;
        border-color: #22d3ee55;
        background: #22d3ee12;
      }
      .chat-result {
        width: 100%;
        padding: 11px;
        border: 1px solid #22d3ee55;
        border-radius: 10px;
        background: #22d3ee0b;
        font-size: 13px;
      }
      .chat-result div {
        margin: 4px 0;
      }
      .chat-result small {
        color: var(--mu);
      }
      #chatInput {
        flex: 1;
        min-width: 0;
        background: var(--c2);
        border: 1px solid var(--bd);
        border-radius: 9px;
        color: var(--tx);
        padding: 9px 10px;
        font: inherit;
        outline: 0;
      }
      #chatInput:focus {
        border-color: var(--cy);
      }
      .ev {
        display: grid;
        grid-template-columns: 58px 1fr;
        gap: 10px;
        padding: 9px 0;
        border-top: 1px solid var(--bd);
      }
      .ev.nw {
        animation: in 0.5s;
        background: #22d3ee0c;
      }
      .hb {
        display: grid;
        grid-template-columns: 120px 1fr 44px;
        gap: 8px;
        align-items: center;
        margin: 7px 0;
        font-size: 12px;
      }
      .tk {
        background: #ffffff0d;
        border-radius: 6px;
        overflow: hidden;
        display: flex;
      }
      .tk i {
        display: block;
        height: 8px;
        background: var(--c);
      }
      .pr {
        animation: rp 1.6s infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      @keyframes rp {
        to {
          transform: scale(2.8);
          opacity: 0;
        }
      }
      .vb rect:hover {
        opacity: 0.7;
      }
      .vid {
        position: relative;
        aspect-ratio: 16/8;
        border-radius: 12px;
        overflow: hidden;
        background: linear-gradient(160deg, #0b1220, #141d33 60%, #0a101d);
        border: 1px solid var(--bd);
      }
      .gd {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(#ffffff08 1px, transparent 1px) 0 0/100% 28px,
          linear-gradient(90deg, #ffffff08 1px, transparent 1px) 0 0/40px 100%;
      }
      .bx {
        position: absolute;
        width: 9%;
        height: 38%;
        border: 1.5px solid var(--cy);
        border-radius: 4px;
        background: #22d3ee10;
        animation: dr var(--d) ease-in-out infinite alternate;
      }
      .bx em {
        position: absolute;
        top: -16px;
        left: -1px;
        font: 600 10px monospace;
        background: var(--cy);
        color: #001;
        padding: 1px 4px;
        border-radius: 3px;
        white-space: nowrap;
      }
      .vid.hot .tg {
        border-color: var(--rd);
        background: #f43f5e18;
        box-shadow: 0 0 18px #f43f5e66;
      }
      .vid.hot .tg em {
        background: var(--rd);
        color: #fff;
      }
      @keyframes dr {
        to {
          transform: translate(70%, 12%);
        }
      }
      .tag {
        position: absolute;
        left: 10px;
        bottom: 8px;
        font: 600 10px monospace;
        background: #000a;
        padding: 3px 7px;
        border-radius: 5px;
        color: var(--am);
      }
      .rec {
        position: absolute;
        right: 10px;
        top: 8px;
        font: 600 10px monospace;
        color: var(--rd);
      }
      .aif {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        height: 100%;
        max-width: 100%;
      }
      .aif img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }
      .bx.lv {
        animation: none;
        transition: all 0.2s linear;
      }
      .bx.lv.ot {
        border-color: var(--bl);
        background: #818cf810;
      }
      .bx.lv.ot em {
        background: var(--bl);
      }
      .cams {
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      }
      .cc {
        cursor: pointer;
        display: grid;
        gap: 5px;
      }
      input[type="range"] {
        flex: 1;
        accent-color: var(--cy);
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
        }
      }

      /* --- Emergency Lockdown Styles --- */
      @keyframes lockdownFlash {
        0% { box-shadow: inset 0 0 0px 0px rgba(244, 63, 94, 0); }
        50% { box-shadow: inset 0 0 100px 30px rgba(244, 63, 94, 0.8); }
        100% { box-shadow: inset 0 0 0px 0px rgba(244, 63, 94, 0); }
      }
      body.lockdown {
        animation: lockdownFlash 1s infinite;
      }
      @keyframes alertEdgePulse {
        0%,
        100% {
          opacity: 0.55;
        }
        50% {
          opacity: 1;
        }
      }
      body.lockdown::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 79;
        pointer-events: none;
        border: 8px solid var(--rd);
        box-shadow: inset 0 0 28px 5px #ff716877, 0 0 22px 6px #ff716866;
        animation: alertEdgePulse 0.85s ease-in-out infinite;
      }
      .critical-modal {
        border: 3px solid var(--rd) !important;
        box-shadow: 0 0 50px rgba(244, 63, 94, 0.5) !important;
        background: linear-gradient(180deg, #300000, var(--card)) !important;
      }
      h1,
      h2,
      .logo {
        font-family: "Barlow Condensed", "IBM Plex Sans", sans-serif;
        letter-spacing: 0;
      }
      h1 {
        font-size: 30px;
        line-height: 1.05;
        font-weight: 600;
      }
      h2 {
        font-size: 19px;
        line-height: 1.15;
        font-weight: 600;
      }
      body {
        background-color: var(--bg);
      }
      nav {
        width: 244px;
        background: #0b1210f2;
        border-color: #25332f;
      }
      .logo {
        font-size: 29px;
      }
      .logo i {
        border-radius: 7px;
        background: var(--gr);
        box-shadow: 0 0 18px #c1e8792b;
      }
      .logo-eye {
        color: var(--cy);
      }
      nav a {
        border-radius: 6px;
        padding: 10px 12px;
      }
      nav a.on {
        background: #64ddbf14;
        box-shadow: inset 3px 0 var(--cy);
      }
      .sys {
        border-radius: 7px;
        background: #101917;
      }
      .top {
        background: #0a1110ed;
        border-color: #25332f;
      }
      .top input,
      #chatInput {
        background: #111a18;
        border-color: #354640;
        border-radius: 7px;
      }
      .chip {
        border-radius: 6px;
        background: #111a18;
      }
      main {
        padding: 28px clamp(18px, 3vw, 38px);
        gap: 18px;
      }
      .card {
        background: linear-gradient(145deg, #141f1c, #101816 72%);
        border-color: #293934;
        border-radius: 8px;
        padding: 17px;
        box-shadow: 0 10px 28px #0003;
      }
      .btn {
        background: var(--cy);
        color: #081411;
        border-radius: 6px;
        padding: 9px 13px;
        transition: transform 150ms ease, background 150ms ease;
      }
      .btn:hover {
        transform: translateY(-1px);
        background: #8be8ce;
      }
      .btn.o {
        background: transparent;
        color: var(--tx);
        border-color: #3a4a44;
      }
      .btn.o:hover {
        color: var(--cy);
        border-color: var(--cy);
        background: #64ddbf0d;
      }
      .b {
        border-radius: 4px;
      }
      .al,
      .nt,
      .kv div,
      .wf div {
        border-radius: 6px;
      }
      .al {
        background: #121b19;
      }
      .ev {
        grid-template-columns: 66px minmax(0, 1fr);
        padding: 11px 2px;
      }
      .ev > span:first-child,
      .big,
      .kv small,
      td:first-child,
      .tag,
      .rec {
        font-variant-numeric: tabular-nums;
      }
      .tag {
        border-radius: 3px;
      }
      .vid {
        border-radius: 6px;
        border-color: #33423d;
        background: linear-gradient(145deg, #101715, #17211e);
      }
      .chat-launch {
        border-radius: 7px;
        border-color: #64ddbf77;
        background: #15211e;
      }
      #chat {
        border-radius: 8px;
      }
      .page-head,
      .section-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 18px;
      }
      .page-head > div:first-child {
        display: grid;
        gap: 5px;
      }
      .eyebrow {

      }

          if (e) e.innerHTML = h;
        };
        set("ai-ents", aiRows());
        set("ai-stats", aiStats());
        set("ai-ov", aiSummary());
      }

      let alertAudio = null;
      function stopAlertSound() {
        if (!alertAudio) return;
        alertAudio.pause();
        alertAudio.currentTime = 0;
        alertAudio = null;
      }

      // --- Critical alert dialog ---
      function triggerLockdown(alertData) {
        if (!alertData) return;
        stopAlertSound();
        document.body.classList.add("lockdown");
        try {
          alertAudio = new Audio(
            "https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg",
          );
          alertAudio.play().catch(() => {});
        } catch (e) {}
        const cameraId = alertData.cam || "CAM-AI";
        const screenshotButton = alertData.snapshotUrl
          ? `<button class="btn o" onclick="openCameraScreenshot('${cameraId}', '${alertData.snapshotUrl}')">View knife screenshot</button>`
          : `<button class="btn o" onclick="openCameraScreenshot('${cameraId}')">View camera screenshot</button>`;
        const emergencyHtml = `
          <div style="text-align: center; padding: 30px 10px;">
            <div style="font-size: 60px; animation: pu 1s infinite;">🚨</div>
            <h1 style="color: var(--rd); font-size: 32px; margin: 15px 0; text-transform: uppercase;">Critical Security Alert</h1>
            <b style="font-size: 24px; display: block; margin-bottom: 10px;">${alertData.type || alertData.x}</b>
            <p class="mu" style="font-size: 16px; margin-bottom: 25px;">
              Camera: <b style="color: white">${cameraId}</b><br>
              Time: ${alertData.t || clk()}
            </p>
            <div class="am" style="justify-content:center; gap:8px; margin-bottom:16px; flex-wrap:wrap;">
              ${screenshotButton}
              <button class="btn o" onclick="askAssistantAboutCamera('${cameraId}', 'Search ${cameraId} for the recent weapon alert and related activity')">Ask assistant</button>
            </div>
            <button class="btn" style="background: var(--rd); color: #fff; width: 100%; font-size: 18px; padding: 15px;" 
                  onclick="closeM(); toast('Alert acknowledged');">
              Acknowledge alert
            </button>
          </div>
        `;
        openM(emergencyHtml, "critical-modal");
      }

      function aiEvent(e, quiet) {
        const id = tid(e.id),
          t = hms(e.time),
          x =
            e.kind == "new"
              ? `New ${e.class} detected`
              : e.kind == "alert"
                ? e.event_type
                : `${e.class} left view`;
        let sev = e.severity || "LOW";
        if (e.kind == "alert" && shouldFilterRepeatAlert(e)) return;
        E.unshift({ t, cam: "CAM-AI", x, p: e.class == "person" ? id : "", s: sev });
        if (E.length > 60) E.pop();

        if (!quiet) {
          if (e.kind == "alert") {
            N.unshift({ s: sev, x: `AI ALERT: ${x} — CAM-AI`, t, u: 1 });
            A.unshift({
              id: "INC-AI-" + S.n++,
              sev: sev,
              type: x,
              pid: e.class == "person" ? id : "TRK-AI",
              cam: "CAM-AI",
              loc: "Live Feed",
              t: t,
              st: "New",
              conf: Math.round((e.conf || 0.9) * 100),
              op: "OPR-AI",
            });
            toast(`🚨 ALERT: ${x}`);
            if (sev === "CRITICAL" || sev === "HIGH") {
              triggerLockdown({ type: x, cam: "CAM-AI", t: t, snapshotUrl: e.snapshot_url || "" });
            }
          } else if (e.kind == "new" && e.class == "person") {
            N.unshift({
              s: "LOW",
              x: `AI detector: person ${id} detected — CAM-AI`,
              t,
              u: 1,
            });
            toast(`AI detector: person ${id} detected`);
          }
        }
        S.fresh = 1;
      }

      async function aiPoll() {
        let next = 5000;
        try {
          const r = await fetch(
            `${AI.url}/api/state?since=${Math.max(AI.seq, 0)}`,
            { cache: "no-store" },
          );
          if (!r.ok) throw new Error(r.status);
          const s = await r.json(),
            first = !AI.on,
            video = AI.st && AI.st.video;
          AI.on = true;
          AI.st = s;
          if (first || s.seq < AI.seq) {
            s.events.slice(-4).forEach((e) => aiEvent(e, true));
            toast("AI detector connected");
          } else s.events.forEach((e) => aiEvent(e, false));
          AI.seq = s.seq;
          if (first || video != s.video) {
            if (["overview", "live", "ai", "people"].includes(S.v) && !S.q)
              render();
          } else if (s.events.length) {
            if (["overview", "alerts", "inc"].includes(S.v) && !S.q) render();
            renderN();
          }
          next = 400;
        } catch (e) {
          if (AI.on) {
            AI.on = false;
            toast("AI detector disconnected");
            if (["overview", "live", "ai", "people"].includes(S.v)) render();
          }
        }
        aiPaint();
        setTimeout(aiPoll, next);
      }

      function aiSetUrl(v) {
        AI.url = v.trim().replace(/\/+$/, "");
        try {
          localStorage.setItem("raqeeb.ai", AI.url);
        } catch (e) {}
        toast("AI detector URL set to " + (AI.url || "same origin"));
      }

      const NAV = [
        ["overview", "Overview", "◫"],
        ["live", "Live Monitoring", "▶"],
        ["ai", "AI Detector", "◎"],
        ["alerts", "Security Alerts", "⚠"],
        ["people", "People Tracking", "☰"],
        ["cams", "Cameras", "◉"],
        ["inc", "Incidents", "⛨"],
        ["evid", "Video Evidence", "▣"],
        ["cyber", "Cybersecurity Logs", "⌗"],
        ["health", "System Health", "♥"],
        ["ana", "Analytics", "▤"],
        ["set", "Settings", "⚙"],
      ];
      function render() {
        $("#nl").innerHTML = NAV.map(
          (n) =>
            `<a class="${S.v == n[0] ? "on" : ""}" title="${n[1]}" onclick="go('${n[0]}')"><b>${n[2]}</b><span>${n[1]}</span></a>`,
        ).join("");
        $("#main").innerHTML = V[S.v]();
        aiPaint();
        $("#dm").textContent = "Demo Simulation: " + (S.demo ? "ON" : "OFF");
        $("#dm").className = "chip" + (S.demo ? " on" : "");
        S.fresh = 0;
      }
      function go(v) {
        S.v = v;
        S.q = "";
        $("#q").value = "";
        S.sev = S.stf = "ALL";
        render();
        scrollTo(0, 0);
      }
      function sq(v) {
        S.q = v;
        if (v && !["alerts", "people", "cams", "inc", "cyber"].includes(S.v))
          S.v = "alerts";
        render();
      }
      document.addEventListener("keydown", (event) => {
        const target = event.target;
        const typing = target instanceof HTMLElement &&
          (["INPUT", "TEXTAREA", "SELECT"].includes(target.tagName) || target.isContentEditable);
        if (event.key == "/" && !typing) {
          event.preventDefault();
          $("#q").focus();
        }
        if (event.key == "Escape") {
          if ($("#m").classList.contains("on")) closeM();
          else if ($("#chat").classList.contains("on")) toggleChat();
        }
      });
      function tgDemo() {
        S.demo = !S.demo;
        render();
        toast("Demo simulation " + (S.demo ? "on" : "off"));
      }
      function toast(t) {
        const d = document.createElement("div");
        d.textContent = t;
        $("#ts").append(d);
        setTimeout(() => d.remove(), 2600);
      }
      function openM(h, c) {
        $("#mb").className = "md " + (c || "");
        $("#mb").innerHTML = h;
        $("#m").classList.add("on");
      }
      let vp = 0;
      function closeM() {
        clearInterval(vp);
        vp = 0;
        $("#m").classList.remove("on");
        document.body.classList.remove("lockdown");
        stopAlertSound();
      }
      const WF = [
          "Detection",
          "Alert generated",
          "Operator review",
          "Video verification",
          "Confirmed / false positive",
          "Response",
          "Resolved",
        ],
        WI = {
          New: 1,
          "Under Review": 2,
          Investigating: 3,
          Confirmed: 4,
          "False Positive": 4,
          Resolved: 6,
        };
      function setSt(id, v) {
        const a = A.find((x) => x.id == id);
        a.st = v;
        toast(id + " set to " + v);
        if ($("#m").classList.contains("on") && $("#rg")) openAlert(id);
        render();
      }
      function openAlert(id) {
        const a = A.find((x) => x.id == id),
          x = WI[a.st];
        S.pt = -30;
        clearInterval(vp);
        vp = 0;
        openM(`<div><button class="x" onclick="closeM()">×</button><div class="am"><h1>${a.id}</h1>${bd(a.sev)}</div><div class="mu">${a.type}</div></div>
<div class="kv"><div><small>Person ID</small><a style="color:var(--cy);cursor:pointer" onclick="openPerson('${a.pid}')">${a.pid}</a></div><div><small>Camera</small><a style="color:var(--cy);cursor:pointer" onclick="openCam('${a.cam}')">${a.cam}</a></div><div><small>Location</small>${a.loc}</div><div><small>Date</small>September 29, 2026</div><div><small>Time</small>${a.t}</div><div><small>Type</small>${a.type}</div><div><small>Confidence</small>${a.conf}%</div><div><small>Status</small>${sel(a)}</div></div>
<div class="wf">${WF.map((w, i) => `<div class="${i < x || (i == x && x == 6) ? "d" : i == x ? "a" : ""}">${w}</div>`).join("")}</div>
<div>${scene(false, "SIMULATED VIDEO EVIDENCE", "ev", a.pid)}<div class="am" style="margin-top:8px"><button class="btn" id="pl" onclick="play()">▶</button><input type="range" id="rg" min="-30" max="30" step="0.5" value="-30" oninput="S.pt=+this.value;fr()"><button class="btn o" onclick="this.textContent=this.textContent=='🔊'?'🔇':'🔊'">🔊</button><button class="btn o" onclick="try{$('#ev').requestFullscreen()}catch(e){}">⛶</button></div><div class="am" style="justify-content:space-between;font-size:11px;color:var(--mu);margin-top:4px"><span>-30s</span><span>-20s</span><span>-10s</span><b style="color:var(--rd)">INCIDENT</b><span>+10s</span><span>+20s</span><span>+30s</span></div><div id="cp" class="mu" style="margin-top:4px">30 seconds BEFORE incident</div></div>
<div class="am"><button class="btn" onclick="openCameraScreenshot('${a.cam}')">View screenshot</button><button class="btn o" onclick="askAssistantAboutCamera('${a.cam}', 'Search ${a.cam} for the recent ${a.type.toLowerCase()} alert')">Ask assistant</button><button class="btn o" onclick="toast('Incident report generated (demo)')">Download report</button></div>`);
      }
      function fr() {
        const r = $("#rg");
        if (!r) return;
        r.value = S.pt;
        const t = S.pt;
        $("#ev").classList.toggle("hot", Math.abs(t) <= 5);
        $("#cp").textContent =
          t == 0
            ? "INCIDENT"
            : t < 0
              ? -t + " seconds BEFORE incident"
              : t + " seconds AFTER incident";
      }
      function play() {
        if (vp) {
          clearInterval(vp);
          vp = 0;
        } else {
          if (S.pt >= 30) S.pt = -30;
          vp = setInterval(() => {
            S.pt = Math.min(30, S.pt + 0.5);
            fr();
            if (S.pt >= 30) play();
          }, 100);
        }
        $("#pl").textContent = vp ? "❚❚" : "▶";
      }
      function openCam(id) {
        const c = C.find((x) => x.id == id);
        if (!c) return toast(id + " is not a camera");
        const al = A.filter((a) => a.cam == id);
        openM(
          `<div><button class="x" onclick="closeM()">×</button><h1>${c.id} · ${c.loc}</h1></div>${scene(
            al.some((a) => a.sev == "CRITICAL" && act_(a)),
            "LIVE DEMO FEED — SIMULATED",
          )}<div class="kv"><div><small>Status</small>${c.st}</div><div><small>Health</small>${c.h}%</div><div><small>Network</small>${c.net}</div><div><small>Latency</small>${c.lat} ms</div><div><small>Last check</small>${c.chk}</div><div><small>Last event</small>${c.ev}</div></div><div class="am" style="margin:12px 0"><button class="btn o" onclick="openCameraScreenshot('${c.id}')">View screenshot</button><button class="btn o" onclick="askAssistantAboutCamera('${c.id}', 'Search ${c.id} for the latest suspicious activity and people by camera')">Ask assistant</button></div>${al.map(arow).join("")}`,
        );
      }
      function openPerson(id) {
        const a = A.find((x) => x.pid == id),
          p =
            P.find((x) => x[0] == id) ||
            (a && [id, a.t, a.t, a.loc, a.cam, a.type, a.sev, "New"]);
        if (!p) return toast("No profile for " + id);
        const mn = (s) => +s.slice(0, 2) * 60 + +s.slice(3, 5),
          f = (n) => pad((n / 60) | 0) + ":" + pad(n % 60),
          al = A.filter((x) => x.pid == id);
        openM(
          `<div><button class="x" onclick="closeM()">×</button><div class="am"><h1>${p[0]}</h1>${bd(p[6])}</div><div class="mu">Temporary anonymous ID · no personal data</div></div><div class="kv"><div><small>Current location</small>${p[3]}</div><div><small>Last camera</small>${p[4]}</div><div><small>Status</small>${p[7]}</div><div><small>Activity</small>${p[5]}</div></div>
<div><h2>Movement timeline</h2><div class="tl"><div><b>${p[1]}</b> CAM-01 · Main Entrance<br><span class="mu">Entered venue</span></div><div><b>${f(((mn(p[1]) + mn(p[2])) / 2) | 0)}</b> CAM-12 · Hall corridor<br><span class="mu">Movement tracked</span></div><div><b>${p[2]}</b> ${p[4]} · ${p[3]}<br><span class="mu">${p[5]}</span></div></div></div><div><h2>Associated alerts</h2><div class="g">${al.map(arow).join("") || '<span class="mu">None</span>'}</div></div>`,
          "dr",
        );
      }
      function toggleChat() {
        const panel = $("#chat"),
          opened = panel.classList.toggle("on");
        $(".chat-launch").setAttribute("aria-expanded", opened);
        if (opened) $("#chatInput").focus();
      }
      function chatMessage(text, role) {
        const node = document.createElement("div");
        node.className = "chat-msg " + role;
        node.textContent = text;
        $("#chatLog").append(node);
        $("#chatLog").scrollTop = $("#chatLog").scrollHeight;
      }
      function submitChat(event) {
        event.preventDefault();
        const input = $("#chatInput"),
          query = input.value.trim();
        if (query) chatSearch(query);
      }
      function chatSearch(query) {
        const text = query.trim();
        if (!text) return;
        chatMessage(text, "user");
        $("#chatInput").value = "";
        const normalized = text.toLowerCase(),
          id = P.find((p) => normalized.includes(p[0].toLowerCase()))?.[0],
          colors = {
            blue: ["blue", "azraq", "أزرق", "ازرق"],
            black: ["black", "dark", "aswad", "أسود", "اسود"],
            white: ["white", "abyad", "أبيض", "ابيض"],
            red: ["red", "ahmar", "أحمر", "احمر"],
            green: ["green", "akhdar", "أخضر", "اخضر"],
            gray: ["gray", "grey", "رمادي"],
            navy: ["navy", "كحلي"],
            yellow: ["yellow", "أصفر", "اصفر"],
          },
          matchColor = Object.keys(colors).find((key) =>
            colors[key].some((word) => normalized.includes(word)),
          );

        // 1. البحث في الكاميرا الحية (Live AI Entities)
        const liveMatches =
          AI.on && AI.st && AI.st.entities
            ? AI.st.entities.filter(
                (e) =>
                  e.class === "person" &&
                  (normalized.includes(tid(e.id).toLowerCase()) ||
                    (matchColor &&
                      (e.color || "").toLowerCase().includes(matchColor)) ||
                    (!matchColor &&
                      (e.color || "").toLowerCase().includes(normalized))),
              )
            : [];

        // 2. البحث في بيانات المحاكاة (Demo Profiles)
        const results = P.filter((p) =>
          id
            ? p[0] == id
            : matchColor
              ? PERSON_APPEARANCE[p[0]].toLowerCase().includes(matchColor)
              : [p[0], p[3], p[4], p[5], PERSON_APPEARANCE[p[0]]]
                  .join(" ")
                  .toLowerCase()
                  .includes(normalized),
        );

        if (!liveMatches.length && !results.length) {
          chatMessage(
            "No match found in live camera or simulated records. Try a clothing color, location, activity, or Person ID.",
            "assistant",
          );
          return;
        }

        const total = liveMatches.length + results.length;
        chatMessage(
          `Found ${total} match${total == 1 ? "" : "es"}${matchColor ? " wearing " + matchColor + " clothing" : ""} (${liveMatches.length} live AI, ${results.length} simulated).`,
          "assistant",
        );

        liveMatches.forEach((e) => {
          const card = document.createElement("div");
          card.className = "chat-result";
          card.innerHTML = `<b>${tid(e.id)} ${bd("LIVE CAMERA", "var(--gr)")}</b><div><small>Detected Clothing Color</small> ${esc(e.color || "Unknown")}</div><div><small>Last seen</small> ${hms(e.last_seen)} · CAM-AI</div><div><small>Confidence</small> ${Math.round(e.conf * 100)}%</div><button class="chip" type="button" onclick="toggleChat();go('ai')">View Live AI Feed</button>`;
          $("#chatLog").append(card);
        });

        results.forEach((p) => {
          const card = document.createElement("div");
          card.className = "chat-result";
          card.innerHTML = `<b>${p[0]}</b><div><small>Appearance</small> ${PERSON_APPEARANCE[p[0]]}</div><div><small>Last seen</small> ${p[2]} · ${p[3]}</div><div><small>Camera</small> ${p[4]}</div><div><small>Recorded activity</small> ${p[5]}</div><button class="chip" type="button" onclick="toggleChat();openPerson('${p[0]}')">Open movement timeline</button>`;
          $("#chatLog").append(card);
        });
        $("#chatLog").scrollTop = $("#chatLog").scrollHeight;
      }
      function tick() {
        if (!S.demo) return;
        const e = SC[S.i++ % SC.length],
          t = clk(),
          c = C.find((x) => x.id == e.c);
        if (e.k == "p") {
          A.unshift({
            id: "INC-2026-00" + S.n++,
            sev: e.s,
            type: e.x,
            pid: e.p,
            cam: e.c,
            loc: c ? c.loc : "Venue",
            t,
            st: "New",
            conf: 80 + Math.floor(Math.random() * 18),
            op: "OPR-0" + (1 + (S.n % 4)),
          });
          if (A.length > 24) A.pop();
          if (e.s == "MEDIUM") S.sus++;
        } else if (e.k == "c")
          L.unshift({
            t,
            ev: e.x,
            tg: e.c,
            src: "10.20." + (S.n % 9) + "." + (20 + (S.n % 200)),
            x: e.y,
            sev: e.s,
            st: "Mitigating",
          });
        E.unshift({ t, cam: e.c, x: e.x, p: e.p || "", s: e.s });
        N.unshift({
          s: e.s,
          x:
            (e.k == "c" ? "Cyber: " : e.k == "m" ? "Predictive: " : "") +
            e.x +
            " — " +
            e.c,
          t,
          u: 1,
        });
        S.fresh = 1;
        S.ppl += Math.floor(Math.random() * 9);
        if (["overview", "alerts", "cyber"].includes(S.v) && !S.q) render();
        renderN();
      }
      function renderN() {
        $("#bc").textContent = N.filter((n) => n.u).length;
        $("#np").innerHTML = N.slice(0, 8)
          .map(
            (n) =>
              `<div class="nt ${n.s == "CRITICAL" ? "cr" : ""}" style="--c:${COL[n.s]}"><b>${n.x}</b><div class="mu">${n.t}</div></div>`,
          )
          .join("");
      }
      function bell() {
        const p = $("#np");
        p.classList.toggle("on");
        if (p.classList.contains("on")) {
          renderN();
          N.forEach((n) => (n.u = 0));
          $("#bc").textContent = 0;
        }
      }

      // --- زر الطوارئ السري للعرض الحي (F9 أو `) ---
      window.addEventListener("keydown", (e) => {
        if (e.key === "F9" || e.key === "`") {
          triggerLockdown({
            type: "Weapon Detected: KNIFE",
            cam: "CAM-AI",
            t: clk(),
          });
        }
      });

      setInterval(
        () =>
          document
            .querySelectorAll(".sy")
            .forEach((e) => (e.textContent = clk())),
        1000,
      );
      render();
      renderN();
      setInterval(tick, 6000);
      aiPoll();
    </script>
  </body>
</html>
